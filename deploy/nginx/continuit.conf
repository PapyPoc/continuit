server {
    listen 80 default_server;
    server_name _;

    root /var/www/continuit;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
